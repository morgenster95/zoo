# Ruční publikování reelu na Instagram z marketing/queue.json (Actions → publish → Run → id položky). Video musí ležet v morgenster95/zoo-media (Pages).
name: publish
on:
  workflow_dispatch:
    inputs:
      id: { description: 'ID položky z marketing/queue.json', required: true }
      dry: { description: 'jen zkontrolovat (nic nezveřejnit): 1', required: false }
concurrency: { group: publish, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      DRY_RUN: ${{ inputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ingest/publish.mjs "${{ inputs.id }}"
      - name: Uložit frontu
        if: always()
        run: |
          git config user.name "zoo-bot"; git config user.email "zoo-bot@users.noreply.github.com"
          git add marketing/queue.json
          git diff --cached --quiet || (git commit -qm "publish: ${{ inputs.id }}" && git pull --rebase -q && git push -q)
