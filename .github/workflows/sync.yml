# Jednorázová (ruční) synchronizace s Instagramem; pravidelně ji dělá smyčka zoo-loop (cron tu GitHub nespouštěl) (followeři → návštěvníci, komentáře → jména a hlasy). Zapne se, až v repu nastavíš:
#   Variables: IG_ENABLED=true, IG_MEDIA_IDS (ID připnutých příspěvků), volitelně IG_REPLY=1
#   Secrets:   IG_ACCESS_TOKEN, IG_USER_ID  (návod: docs/INSTAGRAM.md)
# Stav hry je v data/state.json (commit botem). Nasazení webu navazuje (viz deploy.yml; push botem sám nespouští workflow, proto deploy běží i tady).
name: sync
on:
  workflow_dispatch:
concurrency: { group: sync, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  sync:
    if: ${{ vars.IG_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_MEDIA_IDS: ${{ vars.IG_MEDIA_IDS }}
      IG_REPLY: ${{ vars.IG_REPLY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: node ingest/sync.mjs
      - name: Commit stavu
        run: |
          git config user.name "zoo-bot"; git config user.email "zoo-bot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || (git commit -qm "sync: $(date -u +%FT%TZ)" && git pull --rebase -q && git push -q)
